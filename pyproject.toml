[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logsentinel"
version = "1.0.0"
description = "Analyseur de logs SSH — détection de tentatives de connexion suspectes (brute-force) et génération de rapports."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.optional-dependencies]
ai = ["anthropic>=0.40.0", "pydantic>=2.0"]

[project.scripts]
logsentinel = "logsentinel.cli:main"
logsentinel-incidentbot = "logsentinel.incidentbot:main"

[tool.setuptools]
packages = ["logsentinel"]
